task:
  type: "execute"
  id:
    {{task_id}}
  iteration: {{iteration}}
spec:
  path:
    {{spec_path}}
instructions:
  - "Implement the spec. Cover every acceptance criterion"
  - "Serialize output.json_line_schema to a single JSON line and append it to output.trajectory_file when the task is complete."
scope:
  rule: "Do not broaden scope beyond the spec."
output:
  trajectory_file:
    {{trajectory_file}}
  json_line_schema:
    iteration: "{{iteration}}"
    phase: "execute"
    summary: "<natural description of what was changed and why>"
    covered:
      - "<each AC item implemented>"
