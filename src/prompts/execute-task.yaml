iteration: {{iteration}}
spec:
  path:
    {{spec_path}}
instructions:
  - "Implement the spec and cover every acceptance criterion."
  - "When complete, append output.json_line_schema to output.trajectory_file as a single JSON line."
scope:
  rule: "Stay within the spec."
output:
  trajectory_file:
    {{trajectory_file}}
  json_line_schema:
    iteration: "{{iteration}}"
    phase: "execute"
    summary: "<natural description of what was changed and why>"
    covered:
      - "<each AC item implemented>"
