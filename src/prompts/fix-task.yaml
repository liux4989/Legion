task:
  type: "fix"
  id:
    {{task_id}}
  iteration: {{iteration}}
review_findings:
  {{review_findings}}
instructions:
  - "Fix only the issues listed in review_findings. Do not address anything else."
  - "Append exactly one JSON line matching output.json_line_schema to output.trajectory_file when the fixes are complete."
output:
  trajectory_file:
    {{trajectory_file}}
  append_mode: true
  json_line_schema: |-
    {"iteration":{{iteration}},"phase":"fix","summary":"<one paragraph>"}
