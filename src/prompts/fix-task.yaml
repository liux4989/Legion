task:
  type: "fix"
  id:
    {{task_id}}
  iteration: {{iteration}}
review_findings:
  {{review_findings}}
instructions:
  - "Fix only the issues listed in review_findings. Do not address anything else."
  - "Serialize output.json_line_schema to a single JSON line and append it to output.trajectory_file when the fixes are complete."
output:
  trajectory_file:
    {{trajectory_file}}
  json_line_schema:
    iteration: "{{iteration}}"
    phase: "fix"
    summary: "<one paragraph>"
