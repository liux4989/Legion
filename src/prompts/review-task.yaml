iteration: {{iteration}}
spec:
  path:
    {{spec_path}}
git:
  start_sha:
    {{start_sha}}
prior_findings:
  {{prior_findings}}
review_scope:
  - "completeness": compare the implementation with spec to ensure all requirements are met and all acceptance criteria pass
  - "out of scope": ensure no out-of-scope behaviors are added
  - "bug": actionable errors that must be fixed
review_constraints:
  - "Do not request unrelated refactors."
  - "Do not request broader product changes."
  - "If prior_findings is non-empty, verify each was resolved. Report any unresolved ones and any new bugs in findings."
output:
  trajectory_file:
    {{trajectory_file}}
  json_line_schema:
    iteration: "{{iteration}}"
    phase: "review"
    decision: "pass|fail"
    summary: "<one paragraph>"
    findings:
      - severity: "..."
        title: "..."
        file: "..."
        detail: "..."
